apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  labels:
    app: accounts

spec:
  replicas: 3
  selector:
    matchLabels:
      app: accounts

  template:
    metadata:
      labels:
        app: accounts

    spec:
      containers:
        - name: accounts
          image: tekton-registry:5000/accounts:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: accounts-db
                  key: database-uri