---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: echo
spec:
  description: This task will echo the message.
  params:
    - name: message
      description: The message to echo
      type: string
  steps:
    - name: echo-message
      image: alpine:3
      command: [/bin/echo]
      args: ["$(params.message)"]
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all of the files.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        # Delete any existing contents of the directory if it exists.
        #
        # We don't just "rm -rf ${WORKSPACE_SOURCE_PATH}" because ${WORKSPACE_SOURCE_PATH} might be "/"
        # or the root of a mounted volume.
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          # Delete non-hidden files and directories
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          # Delete files and directories starting with . but excluding ..
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          # Delete files and directories starting with .. plus any other character
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: This task will run nosetests on the provided input.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to nose
      type: string
      default: "-v"
    - name: database_uri
      description: Database connection string
      type: string
      default: "sqlite:///test.db"
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: $(params.database_uri)
      script: |
        #!/bin/bash
        set -e

        echo "***** Installing dependencies *****"
        python -m pip install --upgrade pip wheel
        pip install "setuptools<81"
        pip install -qr requirements.txt

        echo "***** Running nosetests *****"
        nosetests $(params.args)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildkit
spec:
  description: Build and push the application image using BuildKit.
  workspaces:
    - name: source
  params:
    - name: image
      type: string
      description: Destination container image
      default: tekton-registry:5000/accounts:latest
  steps:
    - name: build-and-push
      image: moby/buildkit:latest
      securityContext:
        privileged: true
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        echo "Building image: $(params.image)"

        buildctl-daemonless.sh build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --output type=image,name=$(params.image),push=true,registry.insecure=true

        echo "Image build and push completed."
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kubectl-deploy
spec:
  description: Deploy the application to Kubernetes.
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: alpine/k8s:1.34.1
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        echo "Preparing deployment manifest..."

        sed -i \
          -e 's|image: accounts:latest|image: tekton-registry:5000/accounts:latest|' \
          -e 's|imagePullPolicy: Never|imagePullPolicy: Always|' \
          deploy/deployment.yaml

        echo "Deploying accounts application..."

        kubectl apply -f deploy/deployment.yaml

        echo "Waiting for deployment rollout..."

        kubectl rollout status deployment/accounts --timeout=180s

        echo "Deployment completed successfully."